<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e5442">
<title>木片单车利润</title>
<style>
:root{
  --bg:#f4f6f3; --card:#fff; --line:#e4e8e1; --line2:#eef1ec;
  --ink:#1b241f; --sub:#66706a; --muted:#98a098;
  --p:#1e5442; --p2:#2a7a5f; --p-soft:#eaf3ee;
  --dang:#b93b2f; --warn:#a2650e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:0;
}
input,select,button{font-family:inherit}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 14px 0;
}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-size:15px;font-weight:700;letter-spacing:.2px;color:var(--p)}
.brand em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px}
.tabs{display:flex;gap:18px;margin-top:6px}
.tabs button{
  border:0;background:none;padding:8px 0 9px;font-size:14.5px;color:var(--sub);
  position:relative;font-weight:500;
}
.tabs button.on{color:var(--p);font-weight:600}
.tabs button.on::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;border-radius:2px;background:var(--p);
}

/* ---------- 布局 ---------- */
main{padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;margin-bottom:11px;
}
.card-h{
  display:flex;align-items:center;justify-content:space-between;
  font-size:12.5px;color:var(--muted);margin-bottom:10px;letter-spacing:.3px;
}
.card-h b{font-size:13.5px;color:var(--ink);font-weight:600;letter-spacing:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2+.g2{margin-top:10px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:4px}
.f>span i{font-style:normal;font-size:11px;color:var(--muted)}
.f input,.f select{
  width:100%;min-width:0;height:46px;border:1px solid #dde2da;border-radius:11px;
  padding:0 12px;font-size:16px;color:var(--ink);background:#fbfcf9;
  appearance:none;-webkit-appearance:none;
}
.f input::placeholder{color:#c2c8c1}
.f input:focus,.f select:focus{
  outline:none;border-color:var(--p2);background:#fff;
  box-shadow:0 0 0 3px rgba(42,122,95,.13);
}
.f select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2366706a' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;
}

/* 模式切换 */
.seg{display:flex;gap:3px;background:#ecefe9;border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{
  flex:1;border:0;background:none;padding:9px 2px;border-radius:9px;
  font-size:13px;color:#5c665f;line-height:1.25;
}
.seg button b{display:block;font-size:13px;font-weight:600}
.seg button span{display:block;font-size:10.5px;opacity:.72;margin-top:1px}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(24,40,32,.1)}
.seg button.on b{font-weight:700}

/* 绝干吨提示 */
.calc-line{
  display:flex;align-items:baseline;gap:8px;margin-top:10px;
  padding:9px 11px;background:var(--p-soft);border-radius:10px;
  font-size:13px;color:#2c5f4d;
}
.calc-line b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--p)}
.calc-line small{margin-left:auto;color:#6f8e80;font-size:11.5px}

/* 折叠 */
details{border-top:1px solid var(--line2);margin-top:12px;padding-top:2px}
details summary{
  list-style:none;cursor:pointer;font-size:13px;color:var(--sub);
  padding:10px 0 8px;display:flex;align-items:center;justify-content:space-between;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"展开";font-size:11.5px;color:var(--muted)}
details[open] summary::after{content:"收起"}
details .body{padding-bottom:2px}

/* 按钮 */
.btns{display:flex;gap:10px;margin-top:2px}
.btn{
  flex:1;height:48px;border-radius:12px;border:1px solid #dde2da;background:#fff;
  color:var(--ink);font-size:15px;font-weight:600;
}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn:active{transform:scale(.985)}
.btn.gh{color:var(--sub);font-weight:500;flex:0 0 33%}

/* 底部结果条 */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:none;align-items:center;gap:12px;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(135deg,#1e5442,#17483a);color:#fff;
  box-shadow:0 -8px 24px rgba(18,40,32,.18);
}
.dock.on{display:flex}
.dock.loss{background:linear-gradient(135deg,#a8342a,#8c2a22)}
.dock-l .t{font-size:11.5px;opacity:.78;letter-spacing:.4px}
.dock-l .v{font-size:25px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.dock-l .v small{font-size:14px;font-weight:500;margin-right:1px;opacity:.9}
.dock-m{display:flex;flex-direction:column;gap:3px;margin-left:auto;font-size:11.5px;opacity:.92;text-align:right}
.dock-m b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.dock-x{
  flex:0 0 auto;height:36px;padding:0 13px;border-radius:10px;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);
  color:#fff;font-size:13px;
}
.dock.tip .v{font-size:15px;font-weight:500;opacity:.92}
.dock.tip .dock-m,.dock.tip .dock-x{display:none}

/* 明细 / 选择 面板 */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(16,24,20,.38);animation:fade .18s ease}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;
  background:#fff;border-radius:18px 18px 0 0;
  padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0 12px;position:sticky;top:0;background:#fff;z-index:2;
}
.sheet-h b{font-size:15.5px}
.sheet-h .x{border:0;background:#f2f4f0;width:30px;height:30px;border-radius:50%;font-size:17px;color:var(--sub);line-height:1}
.sheet-t{font-size:12px;color:var(--muted);margin:14px 0 2px;letter-spacing:.4px}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.line .k{color:var(--sub)}
.line .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{border-bottom:0;border-top:1px solid var(--line);margin-top:4px;padding-top:11px}
.line.total .k{color:var(--ink);font-weight:600}
.line.total .v{font-size:17px;color:var(--p)}
.line.total.bad .v{color:var(--dang)}
.alert{
  margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.55;
  background:#fdf6e8;color:#7a5410;border:1px solid #f3e3c2;
}
.alert.d{background:#fdeeea;color:#8c2a22;border-color:#f5d6d0}
.alert.g{background:var(--p-soft);color:#2c5f4d;border-color:#d5e8df}

.pi{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line2);font-size:15px}
.pi:last-child{border:0}
.pi .n{color:var(--ink)}
.pi .a{color:#b6bdb5;font-size:18px}
.pi.empty{color:var(--muted);font-size:13.5px;padding:22px 2px;justify-content:center}

/* 记录 */
.sum{
  background:linear-gradient(135deg,#1e5442,#1a4a3c);color:#fff;border-radius:14px;
  padding:15px 16px;margin-bottom:12px;
}
.sum .t{font-size:12px;opacity:.78;letter-spacing:.4px}
.sum .v{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.sum .r{display:flex;gap:20px;margin-top:8px;font-size:12px;opacity:.9}
.sum .r b{font-size:14px;font-weight:600;display:block;margin-top:1px}
.rec{
  background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;
}
.rec-l{min-width:0;flex:1}
.rec-t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-r{text-align:right;flex:0 0 auto}
.rec-r b{display:block;font-size:16px;font-variant-numeric:tabular-nums;color:var(--p)}
.rec-r b.neg{color:var(--dang)}
.rec-r span{font-size:11.5px;color:var(--muted)}
.empty{
  text-align:center;color:var(--muted);font-size:13.5px;padding:52px 20px;line-height:1.8;
}

/* 档案标签 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--p-soft);color:#235b48;
  border-radius:999px;padding:5px 6px 5px 11px;font-size:12.5px;max-width:100%;
}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:rgba(30,84,66,.12);color:#2c5f4d;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;padding:0}
.addrow{display:flex;gap:8px;margin-top:9px}
.addrow input{
  flex:1;height:42px;border:1px solid #dde2da;border-radius:10px;padding:0 12px;font-size:16px;background:#fbfcf9;
}
.addrow button{
  flex:0 0 auto;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--p);
  background:#fff;color:var(--p);font-size:13.5px;font-weight:600;
}
.pick{
  flex:0 0 auto;width:44px;height:46px;border-radius:11px;border:1px solid #dde2da;
  background:#f3f6f1;color:var(--p);font-size:13px;font-weight:600;
}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(24,32,28,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;max-width:90vw;
}
.toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">木片单车利润<em>离线可用</em></div>
  </div>
  <div class="tabs">
    <button data-nav="calc" class="on">测算</button>
    <button data-nav="rec">记录</button>
    <button data-nav="set">设置</button>
  </div>
</header>

<main>

  <!-- ================= 测算 ================= -->
  <section data-page="calc">
    <div class="seg" id="seg">
      <button data-mode="1" class="on"><b>到场价</b><span>厂家直送</span></button>
      <button data-mode="2"><b>车板价</b><span>自找车</span></button>
      <button data-mode="3"><b>原木加工</b><span>委托代加工</span></button>
    </div>

    <div class="card">
      <div class="card-h"><b>计量</b><span>湿吨进，绝干吨出</span></div>
      <div class="g2">
        <label class="f"><span>到厂湿重 <i>吨</i></span>
          <input type="text" inputmode="decimal" id="wIn" placeholder="0"></label>
        <label class="f"><span>实测含水率 <i>%</i></span>
          <input type="text" inputmode="decimal" id="m" placeholder="0"></label>
      </div>
      <div class="calc-line">
        <span>绝干吨</span><b id="dryOut">—</b>
        <small id="dryHint">填湿重与含水率自动换算</small>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><b>价格</b><span id="priceHint">元 / 湿吨</span></div>
      <div class="g2">
        <label class="f" id="fPw"><span id="lbPw">采购价 <i>元/湿吨</i></span>
          <input type="text" inputmode="decimal" id="pw" placeholder="0"></label>
        <label class="f"><span>纸厂结算价 <i>元/绝干吨</i></span>
          <input type="text" inputmode="decimal" id="pd" placeholder="0"></label>
      </div>

      <!-- 模式2：运费 -->
      <div class="g2" id="rowFreight">
        <label class="f"><span>运费 <i id="frUnit">元/湿吨</i></span>
          <input type="text" inputmode="decimal" id="freight" placeholder="0"></label>
        <label class="f"><span>运费怎么算</span>
          <select id="freightMode">
            <option value="perTon">按吨计</option>
            <option value="perTruck">按车计</option>
          </select></label>
      </div>

      <!-- 模式3：原木 -->
      <div class="g2" id="rowLog" style="display:none">
        <label class="f"><span>原木价 <i>元/湿吨</i></span>
          <input type="text" inputmode="decimal" id="plog" placeholder="0"></label>
        <label class="f"><span>原木含水率 <i>%</i></span>
          <input type="text" inputmode="decimal" id="mlog" placeholder="0"></label>
      </div>
      <div class="g2" id="rowLog2" style="display:none">
        <label class="f"><span>绝干出片率 <i>%</i></span>
          <input type="text" inputmode="decimal" id="r" placeholder="0"></label>
        <label class="f"><span>加工费 <i>元/绝干吨</i></span>
          <input type="text" inputmode="decimal" id="process" placeholder="0"></label>
      </div>
      <div class="g2" id="rowLog3" style="display:none">
        <label class="f"><span>木片运费 <i>元/湿吨</i></span>
          <input type="text" inputmode="decimal" id="freight3" placeholder="0"></label>
        <label class="f"><span>原木运费 <i>元/湿吨原木</i></span>
          <input type="text" inputmode="decimal" id="logFreight" placeholder="0"></label>
      </div>

      <details id="detMore">
        <summary>更多选项（票种 · 扣杂 · 费用 · 车号）</summary>
        <div class="body">
          <div class="g2">
            <label class="f" id="fTicket"><span>上游票种</span>
              <select id="ticket">
                <option value="13">13% 专票</option>
                <option value="3">3% 专票</option>
                <option value="1">1% 专票</option>
              </select></label>
            <label class="f" id="fLogTicket" style="display:none"><span>原木票种</span>
              <select id="logTicket">
                <option value="free">免税发票 / 收购发票</option>
                <option value="9">9% 专票</option>
              </select></label>
            <label class="f"><span>扣杂 <i>吨</i></span>
              <input type="text" inputmode="decimal" id="impurity" placeholder="0"></label>
            <label class="f"><span>其他费用 <i>元/车</i></span>
              <input type="text" inputmode="decimal" id="other" placeholder="0"></label>
            <label class="f"><span>期间费用分摊 <i>元/车</i></span>
              <input type="text" inputmode="decimal" id="periodCost" placeholder="0"></label>
            <label class="f"><span>日期</span>
              <input type="date" id="date"></label>
            <label class="f"><span>车号</span>
              <div style="display:flex;gap:6px">
                <input type="text" id="plate" placeholder="辽A12345" style="flex:1">
                <button class="pick" data-pick="plate" type="button">选</button>
              </div></label>
            <label class="f"><span>供应商</span>
              <div style="display:flex;gap:6px">
                <input type="text" id="supplier" placeholder="木片厂" style="flex:1">
                <button class="pick" data-pick="supplier" type="button">选</button>
              </div></label>
            <label class="f"><span>纸厂</span>
              <div style="display:flex;gap:6px">
                <input type="text" id="mill" placeholder="收货纸厂" style="flex:1">
                <button class="pick" data-pick="mill" type="button">选</button>
              </div></label>
          </div>
        </div>
      </details>
    </div>

    <div class="btns">
      <button class="btn pri" id="btnSave">保存这车</button>
      <button class="btn gh" id="btnClear">清空</button>
    </div>
  </section>

  <!-- ================= 记录 ================= -->
  <section data-page="rec" style="display:none">
    <div class="sum">
      <div class="t">累计净利</div>
      <div class="v" id="sumNet">—</div>
      <div class="r">
        <div>车数<b id="sumCnt">0</b></div>
        <div>净利/车<b id="sumAvg">—</b></div>
        <div>净利/吨<b id="sumPer">—</b></div>
      </div>
    </div>
    <div id="recList"></div>
  </section>

  <!-- ================= 设置 ================= -->
  <section data-page="set" style="display:none">
    <div class="card">
      <div class="card-h"><b>默认价</b><span>保存后同步到测算页</span></div>
      <div class="g2">
        <label class="f"><span>采购价 <i>元/湿吨</i></span><input type="text" inputmode="decimal" id="sPw" placeholder="0"></label>
        <label class="f"><span>纸厂价 <i>元/绝干吨</i></span><input type="text" inputmode="decimal" id="sPd" placeholder="0"></label>
        <label class="f"><span>运费 <i>元/湿吨</i></span><input type="text" inputmode="decimal" id="sFreight" placeholder="0"></label>
        <label class="f"><span>原木价 <i>元/湿吨</i></span><input type="text" inputmode="decimal" id="sPlow" placeholder="0"></label>
        <label class="f"><span>出片率 <i>%</i></span><input type="text" inputmode="decimal" id="sR" placeholder="0"></label>
        <label class="f"><span>加工费 <i>元/绝干吨</i></span><input type="text" inputmode="decimal" id="sProcess" placeholder="0"></label>
        <label class="f"><span>基准含水率 <i>%</i></span><input type="text" inputmode="decimal" id="sM0" placeholder="0"></label>
        <label class="f"><span>原木含水率 <i>%</i></span><input type="text" inputmode="decimal" id="sMlog" placeholder="0"></label>
      </div>
      <div class="hint">基准含水率用于算水分奖罚；留空则按实测水分结算，不做奖罚。</div>
    </div>

    <div class="card">
      <div class="card-h"><b>税率</b><span>政策参数</span></div>
      <div class="g2">
        <label class="f"><span>附加税费率 <i>%</i></span><input type="text" inputmode="decimal" id="sSurtax" placeholder="12"></label>
        <label class="f"><span>企业所得税 <i>%</i></span><input type="text" inputmode="decimal" id="sItax" placeholder="25"></label>
        <label class="f"><span>印花税率 <i>%</i></span><input type="text" inputmode="decimal" id="sStamp" placeholder="0.03"></label>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><b>基础档案</b><span>点「选」按钮直接调用</span></div>

      <details open>
        <summary>供应商</summary>
        <div class="body">
          <div class="chips" id="chips-supplier"></div>
          <div class="addrow">
            <input type="text" id="add-supplier" placeholder="名称，回车添加">
            <button data-add="supplier">添加</button>
          </div>
        </div>
      </details>

      <details>
        <summary>纸厂</summary>
        <div class="body">
          <div class="chips" id="chips-mill"></div>
          <div class="addrow">
            <input type="text" id="add-mill" placeholder="名称，回车添加">
            <button data-add="mill">添加</button>
          </div>
        </div>
      </details>

      <details>
        <summary>车号</summary>
        <div class="body">
          <div class="chips" id="chips-plate"></div>
          <div class="addrow">
            <input type="text" id="add-plate" placeholder="车牌，回车添加">
            <button data-add="plate">添加</button>
          </div>

<script>
// ==ENGINE-START==
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : 0; }

function compute(inp, P, mOv){
  const M = (mOv !== undefined) ? mOv : num(inp.m)/100;
  const M0 = num(P.m0) > 0 ? num(P.m0)/100 : M;
  const wIn = num(inp.wIn), wOut = num(inp.wOut), imp = num(inp.impurity);
  const mode = String(inp.mode);
  const pd = mode === '3' ? num(inp.pd3) : num(inp.pd);
  const dryBase = Math.max(0, wIn - imp);
  const D = dryBase * (1 - M);

  let items = [];
  let extra = {};

  if(mode === '3'){
    const R = num(inp.r)/100;
    const Mlog = num(inp.mlog)/100;
    const logDry = R > 0 && R <= 1 ? D / R : 0;
    const logWet = Mlog < 1 ? logDry / (1 - Mlog) : 0;
    const logAmt = logWet * num(inp.plog);
    const logIn = inp.logTicket === '9' ? logAmt/1.09*0.09 : logAmt*0.09;
    const procAmt = num(inp.process) * D;
    const procIn = procAmt/1.13*0.13;
    const frAmt = num(inp.freight3) * wIn;
    const frIn = frAmt/1.09*0.09;
    const frLogAmt = num(inp.logFreight) * logWet;
    const frLogIn = frLogAmt/1.09*0.09;
    items = [
      {k:'原木', amt:logAmt, vat:logIn},
      {k:'加工费', amt:procAmt, vat:procIn},
      {k:'木片运费', amt:frAmt, vat:frIn}
    ];
    if(frLogAmt > 0) items.push({k:'原木运费', amt:frLogAmt, vat:frLogIn});
    extra = {logWet, logDry, logAmt, logIn, procAmt, procIn, frAmt, frLogAmt};
  } else {
    const settleWet = inp.basis === 'out' ? wOut : wIn;
    const buyAmt = settleWet * num(inp.pw);
    const rate = inp.ticket === '13' ? 0.13 : inp.ticket === '3' ? 0.03 : 0.01;
    const buyIn = buyAmt/(1+rate)*rate;
    let frAmt = 0;
    if(mode === '2'){
      frAmt = inp.freightMode === 'perTruck' ? num(inp.freight) : num(inp.freight)*wIn;
    }
    const frIn = frAmt/1.09*0.09;
    items = [{k:'木片采购', amt:buyAmt, vat:buyIn}];
    if(frAmt > 0) items.push({k:'运费', amt:frAmt, vat:frIn});
    extra = {settleWet, buyAmt, buyIn, frAmt, frIn};
  }

  const other = num(inp.other);
  if(other > 0) items.push({k:'其他费用', amt:other, vat:0, noVat:true});

  const costTax = items.reduce((s,x)=>s+x.amt,0);
  const costIn  = items.reduce((s,x)=>s+x.vat,0);
  const costNet = costTax - costIn;

  const revTax = D * pd;
  const outVat = revTax/1.13*0.13;
  const revNet = revTax - outVat;

  const grossTax = revTax - costTax;
  const gross = revNet - costNet;

  const vatPay = Math.max(0, outVat - costIn);
  const vatCredit = Math.max(0, costIn - outVat);

  const surtax = vatPay * num(P.surtax)/100;
  const stamp = (costNet + revNet) * num(P.stamp)/100;
  const period = num(inp.periodCost);
  const ebt = gross - surtax - stamp - period;
  const itax = Math.max(0, ebt) * num(P.incomeTax)/100;
  const net = ebt - itax;

  const lossPct = (wOut > 0 && mode !== '3') ? (wOut - wIn - imp)/wOut : 0;
  const moistureLoss = (M - M0) * dryBase * pd;

  return {
    D, dryBase, M, M0, pd, revTax, revNet, outVat,
    items, costTax, costIn, costNet,
    grossTax, gross, vatPay, vatCredit, surtax, stamp, period, ebt, itax, net,
    perDry: D > 0 ? net/D : 0,
    vatRate: revNet > 0 ? vatPay/revNet : 0,
    allRate: revNet > 0 ? (vatPay+surtax+stamp+itax)/revNet : 0,
    netMargin: revNet > 0 ? net/revNet : 0,
    lossPct, moistureLoss, extra,
    perDryGrossTax: D > 0 ? grossTax/D : 0
  };
}

function mStar(inp, P){
  if(num(inp.wIn) <= 0 || (String(inp.mode)==='3' ? num(inp.pd3) : num(inp.pd)) <= 0) return null;
  const f = m => compute(inp, P, m).net;
  if(f(0.02) <= 0) return null;
  if(f(0.72) > 0) return null;
  let lo = 0.02, hi = 0.72;
  for(let i=0;i<50;i++){
    const mid = (lo+hi)/2;
    if(f(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo+hi)/2*100;
}

function logStar(inp, P){
  if(String(inp.mode) !== '3' || num(inp.wIn) <= 0 || num(inp.pd3) <= 0) return null;
  const f = p => { const c = Object.assign({}, inp, {plog:p}); return compute(c, P).net; };
  if(f(0) <= 0) return null;
  let lo = 0, hi = 2000;
  if(f(hi) > 0) return null;
  for(let i=0;i<50;i++){
    const mid = (lo+hi)/2;
    if(f(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}
// ==ENGINE-END==

/* ================= 手机版应用层 ================= */
const $ = id => document.getElementById(id);
const K = {P:'wp_m_params_v1', R:'wp_m_records_v1'};

const DEF = {
  m0:'', surtax:12, incomeTax:25, stamp:0.03,
  pw:'', pd:'', freight:'', plow:'', r:'', process:'', mlog:'',
  ticket:'13', supList:[], millList:[], plateList:[]
};

function load(key, def){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return JSON.parse(JSON.stringify(def));
    const v = JSON.parse(raw);
    return Array.isArray(def) ? (Array.isArray(v)?v:def) : Object.assign({}, def, v);
  }catch(e){ return JSON.parse(JSON.stringify(def)); }
}
function save(key, v){
  try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){}
}

let P = load(K.P, DEF);
let REC = load(K.R, []);
let mode = '1';

/* ---- 小工具 ---- */
function fmt(n, d){
  if(!isFinite(n)) return '—';
  const dd = (d === undefined) ? 2 : d;
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('zh-CN', {minimumFractionDigits:dd, maximumFractionDigits:dd});
  return (neg ? '-' : '') + s;
}
function pct(x){ return isFinite(x) ? (x*100).toFixed(2) + '%' : '—'; }
function today(){
  const d = new Date();
  const p = n => (n<10?'0':'') + n;
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
let toastT = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('on'), 1900);
}

/* ---- 表单读写 ---- */
function readInp(){
  return {
    mode,
    date: $('date').value,
    plate: $('plate').value.trim(),
    supplier: $('supplier').value.trim(),
    mill: $('mill').value.trim(),
    ticket: $('ticket').value,
    wOut: 0,
    wIn: num($('wIn').value),
    impurity: num($('impurity').value),
    m: num($('m').value),
    m0: num(P.m0),
    basis: 'in',
    pw: num($('pw').value),
    pd: num($('pd').value),
    pd3: num($('pd').value),
    freightMode: $('freightMode').value,
    freight: num($('freight').value),
    plog: num($('plog').value),
    mlog: num($('mlog').value),
    r: num($('r').value),
    process: num($('process').value),
    logTicket: $('logTicket').value,
    freight3: num($('freight3').value),
    logFreight: num($('logFreight').value),
    other: num($('other').value),
    periodCost: num($('periodCost').value)
  };
}

function setMode(m){
  mode = m;
  document.querySelectorAll('#seg button').forEach(b=> b.classList.toggle('on', b.dataset.mode === m));
  const is3 = m === '3', is2 = m === '2';
  $('rowFreight').style.display = is2 ? '' : 'none';
  $('rowLog').style.display = is3 ? '' : 'none';
  $('rowLog2').style.display = is3 ? '' : 'none';
  $('rowLog3').style.display = is3 ? '' : 'none';
  $('fLogTicket').style.display = is3 ? '' : 'none';
  $('fTicket').style.display = is3 ? 'none' : '';
  // 模式3 原木价在下面单独填，这里把「采购价」收掉，纸厂价占满整行
  $('fPw').style.display = is3 ? 'none' : '';
  $('fPw').parentElement.style.gridTemplateColumns = is3 ? '1fr' : '';
  $('priceHint').textContent = is3 ? '木片按绝干吨结算' : '采购按湿吨计价';
  render();
}

/* ---- 渲染 ---- */
function render(){
  const inp = readInp();
  const R = compute(inp, P);
  const mRaw = $('m').value.trim();
  const mBlank = mRaw === '';
  const is3 = mode === '3';
  const priceOk = is3 ? (inp.plog > 0 && inp.r > 0) : inp.pw > 0;
  const ready = inp.wIn > 0 && inp.pd > 0 && !mBlank && priceOk && R.D > 0;

  $('dryOut').textContent = R.D > 0 ? fmt(R.D, 3) + ' 吨' : '—';
  $('dryHint').textContent = R.D > 0
    ? (inp.wIn - inp.impurity).toFixed(2) + ' 湿吨 × ' + ((1 - R.M)*100).toFixed(0) + '%'
    : '填湿重与含水率自动换算';

  const dock = $('dock');
  if(!ready){
    dock.classList.add('tip');
    dock.classList.remove('loss');
    $('dockPer').textContent = '—';
    $('dockMargin').textContent = '—';
    let tip = '填湿重与含水率，自动出净利';
    if(inp.wIn > 0 && mBlank) tip = '还差实测含水率';
    else if(inp.wIn > 0 && !mBlank && !priceOk) tip = is3 ? '还差原木价与出片率' : '还差采购价';
    else if(inp.wIn > 0 && !mBlank && !inp.pd) tip = '还差纸厂结算价';
    $('dockNet').innerHTML = '<small></small>' + tip;
    return;
  }

  dock.classList.remove('tip');
  dock.classList.toggle('loss', R.net < 0);
  $('dockNet').innerHTML = '<small>¥</small>' + fmt(R.net);
  $('dockPer').textContent = '¥' + fmt(R.perDry);
  $('dockMargin').textContent = pct(R.netMargin);
}

/** 净利=0 时的采购价（元/湿吨）；白送都亏或怎么都赚返回 null */
function pwStar(inp, P){
  if(String(inp.mode) === '3') return null;
  const f = p => compute(Object.assign({}, inp, {pw:p}), P).net;
  if(f(0) <= 0) return null;
  let lo = 0, hi = 5000;
  if(f(hi) > 0) return null;
  for(let i=0;i<50;i++){
    const mid = (lo+hi)/2;
    if(f(mid) > 0) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}

/* ---- 明细面板 ---- */
function lineHTML(k, v, cls){
  return '<div class="line ' + (cls||'') + '"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
}

function detailHTML(inp, R){
  let h = '';
  h += '<div class="sheet-t">收入</div>';
  h += lineHTML('绝干吨 × 纸厂价', fmt(R.D,3) + ' 吨 × ¥' + fmt(R.pd,0));
  h += lineHTML('不含税收入', '¥' + fmt(R.revNet));

  h += '<div class="sheet-t">成本（不含税）</div>';
  R.items.forEach(it=>{
    h += lineHTML(it.k + (it.noVat ? '（无进项）' : '（含税 ¥' + fmt(it.amt) + '）'), '−¥' + fmt(it.amt - it.vat));
  });
  h += lineHTML('成本合计（含税）', '¥' + fmt(R.costTax));

  h += '<div class="sheet-t">利润</div>';
  h += lineHTML('不含税毛利', '¥' + fmt(R.gross));
  if(R.period > 0) h += lineHTML('期间费用', '−¥' + fmt(R.period));
  h += lineHTML('附加税费', '−¥' + fmt(R.surtax));
  h += lineHTML('印花税', '−¥' + fmt(R.stamp));
  h += lineHTML('企业所得税', '−¥' + fmt(R.itax));
  h += '<div class="line total ' + (R.net < 0 ? 'bad' : '') + '"><span class="k">本车净利</span><span class="v">¥' + fmt(R.net) + '</span></div>';

  h += '<div class="sheet-t">税</div>';
  h += lineHTML('销项税额（13%）', '¥' + fmt(R.outVat));
  h += lineHTML('进项税额', '−¥' + fmt(R.costIn));
  h += lineHTML(R.vatCredit > 0 ? '留抵税额' : '应纳增值税', '¥' + fmt(R.vatCredit > 0 ? R.vatCredit : R.vatPay));
  h += lineHTML('全口径税负率', pct(R.allRate));
  h += lineHTML('每绝干吨净利', '¥' + fmt(R.perDry));

  // 关键提示
  const tips = [];
  if(R.net < 0){
    if(String(inp.mode) === '3'){
      const ls = logStar(inp, P);
      if(ls !== null) tips.push('原木价压到 <b>¥' + fmt(ls,0) + '/湿吨</b> 以下这车才不亏。');
    } else {
      const bp = pwStar(inp, P);
      if(bp > 0) tips.push('采购价压到 <b>¥' + fmt(bp,0) + '/湿吨</b> 以下这车才不亏。');
    }
  } else {
    const ms = mStar(inp, P);
    if(ms !== null && ms < 62){
      const room = ms - R.M*100;
      if(room < 6) tips.push('含水率涨到 <b>' + ms.toFixed(1) + '%</b> 就要亏，现在 ' + (R.M*100).toFixed(1) + '%，只剩 <b>' + room.toFixed(1) + ' 个点</b>。');
      else tips.push('含水率红线 <b>' + ms.toFixed(1) + '%</b>，当前 ' + (R.M*100).toFixed(1) + '%，还有 ' + room.toFixed(1) + ' 个点空间。');
    }
    if(String(inp.mode) !== '3' && inp.ticket !== '13'){
      tips.push('上游开的不是 13% 票，进项会少一大块——报价要按票种压价。');
    }
  }
  if(tips.length) h += '<div class="alert ' + (R.net < 0 ? 'd' : '') + '">' + tips.join('<br>') + '</div>';
  return h;
}

function openSheet(title, html){
  $('sheetT').textContent = title;
  $('sheetB').innerHTML = html;
  $('sheet').classList.add('on');
}
function closeSheet(){ $('sheet').classList.remove('on'); }

$('btnSheet').onclick = ()=>{
  const inp = readInp();
  const R = compute(inp, P);
  const ready = inp.wIn > 0 && inp.pd > 0 && $('m').value.trim() !== '' && R.D > 0;
  if(!ready){ toast('先把湿重、含水率、价格填上'); return; }
  openSheet('本车明细', detailHTML(inp, R));
};

/* ---- 记录 ---- */
function renderRec(){
  const list = REC.slice().sort((a,b)=> String(b.savedAt||'').localeCompare(String(a.savedAt||'')));
  const net = list.reduce((s,r)=> s + (r.out ? r.out.net : 0), 0);
  const tons = list.reduce((s,r)=> s + (r.out ? r.out.D : 0), 0);
  $('sumNet').textContent = '¥' + fmt(net);
  $('sumCnt').textContent = list.length;
  $('sumAvg').textContent = '¥' + fmt(list.length ? net/list.length : 0);
  $('sumPer').textContent = '¥' + fmt(tons > 0 ? net/tons : 0);

  if(!list.length){
    $('recList').innerHTML = '<div class="empty">还没有记录<br>在「测算」页填好一车后点保存</div>';
    return;
  }
  $('recList').innerHTML = list.map(r=>{
    const i = r.inp || {}, o = r.out || {};
    const md = i.mode === '3' ? '原木加工' : i.mode === '2' ? '车板价' : '到场价';
    const sub = [i.supplier, i.mill].filter(Boolean).join(' → ') || md;
    const neg = (o.net || 0) < 0;
    return '<div class="rec" data-id="' + r.id + '">'
      + '<div class="rec-l"><div class="rec-t">' + (i.date || '未填日期') + (i.plate ? ' · ' + esc(i.plate) : '') + '</div>'
      + '<div class="rec-s">' + esc(sub) + ' · ' + md + ' · ' + (o.D ? fmt(o.D,3) + ' 吨' : '—') + '</div></div>'
      + '<div class="rec-r"><b class="' + (neg ? 'neg' : '') + '">' + (neg ? '−' : '') + '¥' + fmt(Math.abs(o.net || 0)) + '</b>'
      + '<span>¥' + fmt(o.perDry || 0) + '/吨</span></div></div>';
  }).join('');
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

$('recList').onclick = e=>{
  const card = e.target.closest('.rec');
  if(!card) return;
  const r = REC.find(x=> x.id === card.dataset.id);
  if(!r) return;
  const html = detailHTML(r.inp, r.out)
    + '<div class="btns" style="margin-top:16px"><button class="btn" id="delRec" style="color:#b93b2f">删除这条记录</button></div>';
  openSheet((r.inp.date || '') + ' 这一车', html);
  setTimeout(()=>{
    const b = $('delRec');
    if(b) b.onclick = ()=>{
      if(!confirm('删除这条记录？不可恢复。')) return;
      REC = REC.filter(x=> x.id !== r.id);
      save(K.R, REC); closeSheet(); renderRec(); toast('已删除');
    };
  }, 0);
};

/* ---- 保存 ---- */
$('btnSave').onclick = ()=>{
  const inp = readInp();
  const R = compute(inp, P);
  const problems = [];
  if(inp.wIn <= 0) problems.push('到厂湿重');
  if($('m').value.trim() === '') problems.push('含水率');
  if(inp.pd <= 0) problems.push('纸厂结算价');
  if(mode === '3'){ if(inp.plog <= 0) problems.push('原木价'); if(inp.r <= 0) problems.push('出片率'); }
  else if(inp.pw <= 0) problems.push('采购价');
  if(problems.length){ toast('还差：' + problems.join('、')); return; }

  const rec = {
    id: 'r' + Date.now(),
    inp,
    out: R,
    savedAt: new Date().toISOString()
  };
  REC.push(rec);
  // 新名字自动收进档案
  if(inp.supplier && !P.supList.includes(inp.supplier)) P.supList.push(inp.supplier);
  if(inp.mill && !P.millList.includes(inp.mill)) P.millList.push(inp.mill);
  if(inp.plate && !P.plateList.includes(inp.plate)) P.plateList.push(inp.plate);
  save(K.P, P); save(K.R, REC);
  renderChips(); renderRec();
  toast('已保存 · 净利 ¥' + fmt(R.net));
};

$('btnClear').onclick = ()=>{
  ['wIn','m','pw','pd','freight','plog','mlog','r','process','freight3','logFreight','impurity','other','periodCost']
    .forEach(id=>{ $(id).value = ''; });
  $('plate').value = ''; $('supplier').value = ''; $('mill').value = '';
  $('date').value = today();
  render();
  toast('已清空');
};

/* ---- 档案 ---- */
const DICTS = {
  supplier: {k:'supList', label:'供应商'},
  mill:     {k:'millList', label:'纸厂'},
  plate:    {k:'plateList', label:'车号'}
};
function arrOf(kind){
  const key = DICTS[kind].k;
  if(!Array.isArray(P[key])) P[key] = [];
  return P[key];
}
function renderChips(){
  Object.keys(DICTS).forEach(kind=>{
    const arr = arrOf(kind);
    const box = $('chips-' + kind);
    if(!box) return;
    box.innerHTML = arr.length
      ? arr.map((v, i)=> '<span class="chip"><span>' + esc(v) + '</span><button data-del="' + kind + '" data-i="' + i + '">×</button></span>').join('')
      : '<span class="hint" style="margin:0">还没有</span>';
    // 更新折叠标题条数
    const d = box.closest('details');
    if(d){
      const s = d.querySelector('summary');
      const base = DICTS[kind].label;
      s.textContent = base + (arr.length ? '（' + arr.length + '）' : '');
    }
  });
}
function addChip(kind){
  const input = $('add-' + kind);
  const raw = input.value.trim();
  if(!raw) return;
  const arr = arrOf(kind);
  let n = 0;
  raw.split(/[,，、;；\n]/).map(s=>s.trim()).filter(Boolean).forEach(v=>{
    if(!arr.includes(v)){ arr.push(v); n++; }
  });
  save(K.P, P);
  input.value = '';
  renderChips();
  if(n) toast('已添加 ' + n + ' 条');
}

document.addEventListener('click', e=>{
  if(e.target.closest('[data-close]')){ closeSheet(); return; }

  const add = e.target.closest('[data-add]');
  if(add){ addChip(add.dataset.add); return; }

  const del = e.target.closest('[data-del]');
  if(del){
    arrOf(del.dataset.del).splice(+del.dataset.i, 1);
    save(K.P, P); renderChips();
    return;
  }

  const pick = e.target.closest('.pick');
  if(pick){
    const kind = pick.dataset.pick;
    const arr = arrOf(kind);
    const html = arr.length
      ? arr.map(v=> '<div class="pi" data-v="' + esc(v) + '" data-k="' + kind + '"><span class="n">' + esc(v) + '</span><span class="a">›</span></div>').join('')
      : '<div class="pi empty">档案还是空的，去「设置 → 基础档案」先添加</div>';
    openSheet('选择' + DICTS[kind].label, html);
    return;
  }

  const item = e.target.closest('.pi[data-v]');
  if(item){
    $(item.dataset.k).value = item.dataset.v;
    closeSheet();
    render();
    return;
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeSheet();
  if(e.key === 'Enter' && e.target.id && /^add-(supplier|mill|plate)$/.test(e.target.id)){
    e.preventDefault();
    addChip(e.target.id.slice(4));
  }
});

/* ---- 设置 ---- */
function fillSet(){
  const set = (id, v)=> { $(id).value = (v === 0 || v) ? v : ''; };
  set('sPw', P.pw); set('sPd', P.pd); set('sFreight', P.freight);
  set('sPlow', P.plow); set('sR', P.r); set('sProcess', P.process);
  set('sM0', P.m0); set('sMlog', P.mlog);
  set('sSurtax', P.surtax); set('sItax', P.incomeTax); set('sStamp', P.stamp);
  renderChips();
}

function applyParams(){
  const map = { pw:P.pw, pd:P.pd, freight:P.freight, plog:P.plow, mlog:P.mlog, r:P.r, process:P.process };
  Object.keys(map).forEach(id=>{
    const v = map[id];
    if(v === '' || v === null || v === undefined) return;
    $(id).value = v;
  });
  if(P.ticket) $('ticket').value = P.ticket;
}

$('btnSaveSet').onclick = ()=>{
  const nb = id => { const v = $(id).value.trim(); return v === '' ? '' : num(v); };
  P = {
    m0: nb('sM0'),
    surtax: num($('sSurtax').value) || 12,
    incomeTax: num($('sItax').value) || 25,
    stamp: $('sStamp').value.trim() === '' ? 0.03 : num($('sStamp').value),
    pw: nb('sPw'), pd: nb('sPd'), freight: nb('sFreight'),
    plow: nb('sPlow'), r: nb('sR'), process: nb('sProcess'), mlog: nb('sMlog'),
    ticket: P.ticket || '13',
    supList: P.supList, millList: P.millList, plateList: P.plateList
  };
  save(K.P, P);
  applyParams();
  fillSet();
  render();
  toast('设置已保存并同步');
};

/* ---- 备份 ---- */
$('btnBackup').onclick = ()=>{
  const data = {v:2, app:'mobile', P, REC, at:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '木片测算备份-' + today() + '.json';
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
  toast('已导出备份文件');
};
$('btnRestore').onclick = ()=> $('fileRestore').click();
$('fileRestore').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const d = JSON.parse(rd.result);
      if(d.P){ P = Object.assign({}, DEF, d.P); save(K.P, P); }
      if(Array.isArray(d.REC)){ REC = d.REC; save(K.R, REC); }
      fillSet(); applyParams(); renderChips(); renderRec(); render();
      toast('已导入 ' + (REC.length) + ' 条记录');
    }catch(err){ toast('文件格式不对'); }
  };
  rd.readAsText(f);
  e.target.value = '';
};

/* ---- 页面切换 ---- */
function go(page){
  document.querySelectorAll('[data-page]').forEach(sec=>{
    sec.style.display = (sec.dataset.page === page) ? '' : 'none';
  });
  document.querySelectorAll('[data-nav]').forEach(b=> b.classList.toggle('on', b.dataset.nav === page));
  $('dock').classList.toggle('on', page === 'calc');
  window.scrollTo(0, 0);
  if(page === 'rec') renderRec();
  if(page === 'set') fillSet();
}
document.querySelectorAll('[data-nav]').forEach(b=> b.onclick = ()=> go(b.dataset.nav));

/* ---- 输入即算 ---- */
document.querySelectorAll('[data-page="calc"] input, [data-page="calc"] select')
  .forEach(el=>{ el.addEventListener('input', render); el.addEventListener('change', render); });

document.querySelectorAll('#seg button').forEach(b=>{
  b.onclick = ()=> setMode(b.dataset.mode);
});

/* ---- 启动 ---- */
(function init(){
  $('date').value = today();
  applyParams();
  setMode('1');
  fillSet();
  renderChips();
  renderRec();
  go('calc');
  render();
})();
</script>
</body>
</html>
